name: Metrics
on:
  # Schedule every 12 hours
  schedule: [{cron: "0 */12 * * *"}]
  # (optional) Run workflow manually
  workflow_dispatch:
  # (optional) Run workflow when pushing on master/main
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate unified GitHub metrics
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          # Accurate stats need a personal access token saved as the METRICS_TOKEN secret.
          # The default GITHUB_TOKEN only sees this repo ("1 repository", "100% Python").
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: TUSHAR91316
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
